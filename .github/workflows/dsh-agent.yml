name: DSH Web with Public Runner & Private Storage

on:
  workflow_dispatch: # 仅手动触发，按需使用

jobs:
  run-dsh-web:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # 留出余量，避免触及 GitHub 6小时硬限制

    steps:
      - name: Checkout public runner repo
        uses: actions/checkout@v5

      - name: Checkout private data repository
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.PRIVATE_DATA_REPO }}
          token: ${{ secrets.PRIVATE_DATA_REPO_PAT }}
          path: 'private-data'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install DSH and cloudflared
        run: |
          npm install -g @deepseek-ai/dsh@alpha
          curl -sL -o cloudflared "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          chmod +x cloudflared

      - name: Install DSH web auth plugin
        run: dsh plugin --profile web add -w @fonlan/dsh-web-auth

      # 【恢复】将私有仓库中的 .dsh 数据复制到运行环境
      - name: Restore DSH data from private repository
        run: |
          if [ -d "./private-data/dsh-data" ]; then
            mkdir -p ~/.dsh
            rsync -a --delete ./private-data/dsh-data/ ~/.dsh/
            echo "DSH data restored."
          else
            echo "No previous DSH data found. Starting fresh."
          fi

      # 【关键修复】修正从仓库恢复的敏感文件权限，防止 DSH 因 assertOwnerOnly 报错拒绝启动
      - name: Fix DSH data permissions
        run: |
          echo "Tightening permissions on DSH credential files..."
          chmod 700 ~/.dsh
          if [ -f ~/.dsh/.credentials.yaml ]; then
            chmod 600 ~/.dsh/.credentials.yaml
            echo "✅ ~/.dsh/.credentials.yaml permission set to 600."
          else
            echo "ℹ️ ~/.dsh/.credentials.yaml not found, skipping."
          fi

      # 启动 DSH Web，使用 setsid 避免进程随 Shell 退出而终止
      - name: Start DSH Web
        run: |
          setsid dsh web > dsh-web.log 2>&1 < /dev/null &
          echo "Waiting for DSH Web on port 3080..."
          sleep 15
          if curl -s http://127.0.0.1:3080 > /dev/null; then
            echo "✅ DSH Web is ready."
          else
            echo "⚠️ DSH Web may not be ready. Showing log:"
            cat dsh-web.log
          fi
        env:
          DSH_WEB_AUTH_PASSWORD: ${{ secrets.DSH_WEB_AUTH_PASSWORD }}

      # 启动 Cloudflare Quick Tunnel，并精准抓取链接
      - name: Start Cloudflare Tunnel
        run: |
          nohup ./cloudflared tunnel --url http://127.0.0.1:3080 --protocol http2 > tunnel.log 2>&1 &
          echo "Waiting for public URL..."
          
          URL=""
          for i in $(seq 1 60); do
            # 必须匹配完整的 https://xxx.trycloudflare.com 才算成功
            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log | head -1)
            if [ -n "$URL" ]; then
              echo "✅ 成功获取公网链接: $URL"
              echo "PUBLIC_URL=$URL" >> $GITHUB_ENV
              break
            fi
            sleep 1
          done
          
          if [ -z "$URL" ]; then
            echo "⚠️ 未获取到链接，请查看下方完整日志："
            cat tunnel.log
          fi

      # 保持作业运行，并实时打印链接和状态
      - name: Keep alive
        run: |
          echo "DSH Web 和隧道正在运行。要停止，请手动点击 'Cancel workflow'。"
          echo "=================================================="
          if [ -n "$PUBLIC_URL" ]; then
            echo "你的 DSH Web 访问链接是: $PUBLIC_URL"
          fi
          echo "=================================================="
          
          while true; do 
            sleep 30
            echo "--- 隧道最新状态 $(date -u) ---"
            tail -n 5 tunnel.log
            echo "--- DSH Web 进程状态 ---"
            if pgrep -f "dsh web" > /dev/null; then
              echo "✅ DSH Web 进程正在运行。"
            else
              echo "❌ DSH Web 进程已退出！以下是退出前的日志片段："
              tail -n 20 dsh-web.log
            fi
          done

      # 【备份】将 ~/.dsh 同步回私有仓库并推送
      - name: Backup DSH data to private repository
        if: always()
        run: |
          if [ -d ~/.dsh ]; then
            mkdir -p ./private-data/dsh-data
            rsync -a --delete ~/.dsh/ ./private-data/dsh-data/
            cd private-data
            git config user.name "DSH Agent (Public Runner)"
            git config user.email "dsh-agent@users.noreply.github.com"
            git add ./dsh-data
            git diff --staged --quiet || git commit -m "Backup from public runner $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
