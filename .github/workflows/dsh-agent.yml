
name: DSH Web with Persistent Agent Memory

on:
  workflow_dispatch:

# 避免同一个 Workflow 同时运行多个 Runner
concurrency:
  group: dsh-web-persistent-agent
  cancel-in-progress: false

permissions:
  contents: read

env:
  CUSTOM_DOMAIN: "https://dsh.gyegt614.top"
  BACKUP_INTERVAL: "600"
  PRIVATE_DATA_DIR: "private-data"

  # 没有历史数据时允许初始化
  # 已存在的数据不会因此被删除
  ALLOW_EMPTY_BOOTSTRAP: "true"

jobs:
  run-dsh-web:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ==========================================
      # 1. Checkout 公共 Runner 仓库
      # ==========================================
      - name: Checkout public runner repo
        uses: actions/checkout@v5

      # ==========================================
      # 2. Checkout 私有数据仓库
      # ==========================================
      - name: Checkout private data repository
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.PRIVATE_DATA_REPO }}
          token: ${{ secrets.PRIVATE_DATA_REPO_PAT }}
          path: private-data
          fetch-depth: 0

      # ==========================================
      # 3. 安装运行环境
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install DSH and cloudflared
        run: |
          set -Eeuo pipefail

          npm install -g @deepseek-ai/dsh@alpha

          curl -fsSL -o cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"

          chmod +x cloudflared

      # ==========================================
      # 4. 恢复 DSH 数据与工作区
      # ==========================================
      - name: Restore DSH data and workspaces
        id: restore
        shell: bash
        run: |
          set -Eeuo pipefail

          PRIVATE_DATA="./private-data"

          echo "Checking persistent data repository..."

          if [ ! -d "$PRIVATE_DATA/.git" ]; then
            echo "ERROR: Private data repository unavailable."
            exit 1
          fi

          # 自动识别历史 DSH 数据目录
          DSH_SOURCE=""

          if [ -d "$PRIVATE_DATA/dsh-data" ]; then

            DSH_SOURCE="$PRIVATE_DATA/dsh-data"
            echo "Found dsh-data directory."

          elif [ -d "$PRIVATE_DATA/.dsh" ]; then

            DSH_SOURCE="$PRIVATE_DATA/.dsh"
            echo "Found legacy .dsh directory."

          elif [ -d "$PRIVATE_DATA/dsh" ]; then

            DSH_SOURCE="$PRIVATE_DATA/dsh"
            echo "Found legacy dsh directory."

          fi

          # 如果没有找到历史数据，初始化新目录
          if [ -z "$DSH_SOURCE" ]; then

            if [ "$ALLOW_EMPTY_BOOTSTRAP" != "true" ]; then
              echo "ERROR: No DSH data found."
              exit 1
            fi

            echo "WARNING: No previous DSH data found."
            echo "Initializing a new DSH data directory."

            mkdir -p "$PRIVATE_DATA/dsh-data"

            DSH_SOURCE="$PRIVATE_DATA/dsh-data"

          fi

          # 恢复 DSH 数据
          mkdir -p "$HOME/.dsh"

          rsync -a --delete \
            "$DSH_SOURCE/" \
            "$HOME/.dsh/"

          echo "DSH data restored."

          # 恢复工作区
          if [ -d "$PRIVATE_DATA/workspaces" ]; then

            find "$PRIVATE_DATA/workspaces" \
              -mindepth 1 -maxdepth 1 -type d -print0 |
            while IFS= read -r -d '' dir; do

              dirname=$(basename "$dir")

              echo "Restoring workspace: $dirname"

              mkdir -p "/home/runner/$dirname"

              rsync -a --delete \
                "$dir/" \
                "/home/runner/$dirname/"

            done

          else

            echo "No previous workspaces found."

          fi

          # 设置权限
          chmod 700 "$HOME/.dsh"

          if [ -f "$HOME/.dsh/.credentials.yaml" ]; then
            chmod 600 "$HOME/.dsh/.credentials.yaml"
          fi

          # 检查恢复目录
          if [ ! -d "$HOME/.dsh" ]; then
            echo "ERROR: DSH restoration failed."
            exit 1
          fi

          echo "restored=true" >> "$GITHUB_OUTPUT"

          echo "=================================="
          echo "DSH restoration completed."
          echo "=================================="

      # ==========================================
      # 5. 创建备份脚本
      # ==========================================
      - name: Prepare persistent backup script
        run: |
          set -Eeuo pipefail

          cat > "$RUNNER_TEMP/dsh-backup.sh" <<'BACKUP_SCRIPT'
          #!/usr/bin/env bash

          set -Eeuo pipefail

          PRIVATE_DATA="$GITHUB_WORKSPACE/$PRIVATE_DATA_DIR"

          # 防止同一 Runner 内重复备份
          exec 9>"$RUNNER_TEMP/dsh-backup.lock"

          if ! flock -n 9; then
            echo "Another backup is running. Skipping."
            exit 0
          fi

          if [ ! -d "$PRIVATE_DATA/.git" ]; then
            echo "ERROR: Private repository unavailable."
            exit 1
          fi

          if [ ! -d "$HOME/.dsh" ]; then
            echo "ERROR: DSH directory missing."
            exit 1
          fi

          echo "Starting DSH backup..."

          mkdir -p "$PRIVATE_DATA/dsh-data"
          mkdir -p "$PRIVATE_DATA/workspaces"

          # 1. 备份完整 DSH 数据
          rsync -a --delete \
            "$HOME/.dsh/" \
            "$PRIVATE_DATA/dsh-data/"

          # 2. 备份工作区
          for dir in /home/runner/*; do

            [ -d "$dir" ] || continue

            dirname=$(basename "$dir")

            case "$dirname" in
              actions-runner|work|_work|hostedtoolcache|toolcache)
                continue
                ;;
            esac

            echo "Backing up workspace: $dirname"

            mkdir -p "$PRIVATE_DATA/workspaces/$dirname"

            rsync -a --delete \
              "$dir/" \
              "$PRIVATE_DATA/workspaces/$dirname/"

          done

          # 3. 设置 Git 身份
          git -C "$PRIVATE_DATA" config user.name "DSH Agent"

          git -C "$PRIVATE_DATA" config user.email \
            "dsh-agent@users.noreply.github.com"

          # 4. 增量提交
          git -C "$PRIVATE_DATA" add -A -- dsh-data workspaces

          if git -C "$PRIVATE_DATA" diff --cached --quiet; then
            echo "No changes. Backup skipped."
            exit 0
          fi

          git -C "$PRIVATE_DATA" commit \
            -m "DSH automatic backup $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # 5. 推送，失败时同步远程分支
          BRANCH=$(git -C "$PRIVATE_DATA" branch --show-current)

          if [ -z "$BRANCH" ]; then
            echo "ERROR: Git branch unavailable."
            exit 1
          fi

          for attempt in 1 2 3; do

            if git -C "$PRIVATE_DATA" push origin "$BRANCH"; then
              echo "Backup pushed successfully."
              exit 0
            fi

            echo "Push failed. Attempt: $attempt"

            if [ "$attempt" -lt 3 ]; then

              git -C "$PRIVATE_DATA" fetch origin "$BRANCH"

              if ! git -C "$PRIVATE_DATA" rebase "origin/$BRANCH"; then
                git -C "$PRIVATE_DATA" rebase --abort || true

                echo "ERROR: Rebase conflict."
                exit 1
              fi

            fi

          done

          echo "ERROR: Backup push failed."
          exit 1

          BACKUP_SCRIPT

          chmod +x "$RUNNER_TEMP/dsh-backup.sh"

      # ==========================================
      # 6. 启动 Cloudflare Named Tunnel
      # ==========================================
      - name: Start Cloudflare Named Tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "ERROR: Cloudflare token missing."
            exit 1
          fi

          nohup ./cloudflared tunnel \
            --no-autoupdate run \
            --token "$CLOUDFLARE_TUNNEL_TOKEN" \
            > tunnel.log 2>&1 < /dev/null &

          echo $! > cloudflared.pid

          echo "Waiting for Tunnel..."

          CONNECTED=false

          for i in $(seq 1 60); do

            if grep -q "Registered tunnel connection" tunnel.log; then
              CONNECTED=true
              break
            fi

            if ! kill -0 "$(cat cloudflared.pid)" 2>/dev/null; then
              echo "ERROR: cloudflared exited."
              break
            fi

            sleep 1

          done

          if [ "$CONNECTED" != "true" ]; then
            echo "ERROR: Tunnel connection failed."
            tail -50 tunnel.log
            exit 1
          fi

          echo "Cloudflare Tunnel connected."

      # ==========================================
      # 7. 启动 DSH Web
      # ==========================================
      - name: Start DSH Web
        id: dsh
        env:
          DSH_WEB_AUTH_PASSWORD: ${{ secrets.DSH_WEB_AUTH_PASSWORD }}
        run: |
          set -Eeuo pipefail

          PUBLIC_HOST="${CUSTOM_DOMAIN#https://}"
          PUBLIC_HOST="${PUBLIC_HOST#http://}"
          PUBLIC_HOST="${PUBLIC_HOST%/}"

          echo "Starting DSH Web..."

          setsid dsh web \
            --public-url "$CUSTOM_DOMAIN" \
            --trusted-host "$PUBLIC_HOST" \
            > dsh-web.log 2>&1 < /dev/null &

          echo $! > dsh-web.pid

          echo "Waiting for DSH Web..."

          READY=false

          for i in $(seq 1 60); do

            if curl -fsS http://127.0.0.1:3080 >/dev/null; then
              READY=true
              break
            fi

            sleep 1

          done

          if [ "$READY" != "true" ]; then
            echo "ERROR: DSH Web failed to start."
            tail -50 dsh-web.log
            exit 1
          fi

          echo "DSH Web is ready."

          # 提取 Token
          RAW_TOKEN_URL=$(
            grep -oE 'https?://[^[:space:]]*token=[a-zA-Z0-9_-]+' \
              dsh-web.log | head -1 || true
          )

          if [ -n "$RAW_TOKEN_URL" ]; then

            TOKEN_STR=$(
              echo "$RAW_TOKEN_URL" |
              sed -E 's/.*token=([a-zA-Z0-9_-]+).*/\1/'
            )

            TOKEN_URL="https://${PUBLIC_HOST}/?token=${TOKEN_STR}"

            echo "::add-mask::$TOKEN_STR"
            echo "::add-mask::$TOKEN_URL"

            echo "TOKEN_URL=$TOKEN_URL" >> "$GITHUB_ENV"

            echo "has_token=true" >> "$GITHUB_OUTPUT"

            echo "DSH access token extracted."

          else

            echo "has_token=false" >> "$GITHUB_OUTPUT"

            echo "WARNING: Token not found."

          fi

      # ==========================================
      # 8. 推送 URL 到微信
      # ==========================================
      - name: Push URL to WX API
        if: steps.dsh.outputs.has_token == 'true'
        continue-on-error: true
        env:
          WX_TOKEN: ${{ secrets.WX_TOKEN }}
          PUSH_API_URL: ${{ secrets.PUSH_API_URL }}
        run: |
          set -Eeuo pipefail

          echo "Pushing DSH URL to WX API..."

          TS=$(date +%s)
          NONCE=$RANDOM

          SORT_STR=$(
            printf "%s\n%s\n%s" "$WX_TOKEN" "$TS" "$NONCE" |
            LC_ALL=C sort |
            tr -d "\n"
          )

          SIG=$(printf "%s" "$SORT_STR" | sha1sum | awk '{print $1}')

          XML_DATA=$(cat <<EOF
          <xml>
            <ToUserName><![CDATA[gh_test]]></ToUserName>
            <FromUserName><![CDATA[oUPTI2yAIBpKK_YkxHttqSc7TYiw]]></FromUserName>
            <CreateTime>$(date +%s)</CreateTime>
            <MsgType><![CDATA[text]]></MsgType>
            <Content><![CDATA[202 ${TOKEN_URL}]]></Content>
          </xml>
          EOF
          )

          REQ_URL="${PUSH_API_URL}?signature=${SIG}&timestamp=${TS}&nonce=${NONCE}"

          HTTP_STATUS=$(curl -L --post301 --post302 -sS \
            -w "%{http_code}" \
            -o response.txt \
            -X POST \
            "$REQ_URL" \
            -H 'Content-Type: text/xml' \
            --data-binary "$XML_DATA")

          echo "HTTP Status: $HTTP_STATUS"

          cat response.txt

      # ==========================================
      # 9. 定时备份与保持运行
      # ==========================================
      - name: Keep alive and periodic backup
        timeout-minutes: 310
        run: |
          set -Eeuo pipefail

          echo "DSH Web is running."

          # 启动后立即备份
          bash "$RUNNER_TEMP/dsh-backup.sh"

          START_TIME=$(date +%s)
          LAST_BACKUP=$START_TIME

          # 运行 300 分钟，给最终备份留时间
          MAX_RUNTIME=$((300 * 60))

          while true; do

            sleep 30

            # 检查 DSH 进程
            if ! pgrep -f '[d]sh web' > /dev/null; then
              echo "ERROR: DSH Web process exited."
              exit 1
            fi

            NOW=$(date +%s)

            ELAPSED=$((NOW - START_TIME))

            # 每隔 10 分钟备份
            if (( NOW - LAST_BACKUP >= BACKUP_INTERVAL )); then

              echo "Periodic backup started."

              bash "$RUNNER_TEMP/dsh-backup.sh"

              LAST_BACKUP=$(date +%s)

              echo "Periodic backup completed."

            fi

            # 达到运行时间，退出等待
            if (( ELAPSED >= MAX_RUNTIME )); then

              echo "Maximum runtime reached."
              echo "Preparing final backup."

              break

            fi

          done

      # ==========================================
      # 10. 最终备份
      # ==========================================
      - name: Final backup DSH data and workspaces
        if: always() && steps.restore.outputs.restored == 'true'
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail

          echo "Starting final backup..."

          bash "$RUNNER_TEMP/dsh-backup.sh"

          echo "Final backup completed."

      # ==========================================
      # 11. 输出状态
      # ==========================================
      - name: Show DSH status
        if: always()
        run: |
          echo "=================================="
          echo "DSH workflow finished."
          echo "=================================="

          if [ -f dsh-web.log ]; then
            echo "DSH log file exists."
          fi

          if [ -f tunnel.log ]; then
            echo "Tunnel log file exists."
          fi
