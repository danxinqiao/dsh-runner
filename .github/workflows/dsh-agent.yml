name: DSH Web with Named Tunnel (Token Mode)

on:
  workflow_dispatch:

concurrency:
  group: dsh-web-named-tunnel
  cancel-in-progress: false

permissions:
  contents: read

env:
  CUSTOM_DOMAIN: "https://dsh.gyegt614.top"
  BACKUP_INTERVAL: "600"
  PRIVATE_DATA_DIR: "private-data"
  ALLOW_EMPTY_BOOTSTRAP: "true"
  SUPABASE_S3_MOUNT: "/mnt/dsh-supabase-s3"
  CLOUDFLARE_R2_MOUNT: "/mnt/dsh-cloudflare-r2"

jobs:
  run-dsh-web:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      # --------------------------------------------------
      # 1. Checkout public runner repository
      # --------------------------------------------------
      - name: Checkout public runner repo
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Checkout private data repository
      # --------------------------------------------------
      - name: Checkout private data repository
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.PRIVATE_DATA_REPO }}
          token: ${{ secrets.PRIVATE_DATA_REPO_PAT }}
          path: private-data
          fetch-depth: 1

      # --------------------------------------------------
      # 3. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      # --------------------------------------------------
      # 4. Install DSH
      # --------------------------------------------------
      - name: Install DSH
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install -g @deepseek-ai/dsh@alpha
          echo "DSH version:"
          dsh --version

      # --------------------------------------------------
      # 5. Install Cloudflare Tunnel
      # --------------------------------------------------
      - name: Install cloudflared
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      # --------------------------------------------------
      # 6. Install rclone and FUSE for S3-compatible mounts
      # --------------------------------------------------
      - name: Install rclone and FUSE
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone fuse3
          rclone version

      # --------------------------------------------------
      # 7. Restore DSH data and workspaces
      # --------------------------------------------------
      - name: Restore persistent data
        id: restore
        shell: bash
        run: |
          set -Eeuo pipefail
          PRIVATE_DIR="$PRIVATE_DATA_DIR"

          echo "Checking persistent data repository..."
          if [ ! -d "$PRIVATE_DIR/.git" ]; then
            echo "ERROR: Private data repository is not initialized."
            exit 1
          fi

          mkdir -p "$HOME/.dsh"
          SOURCE_DIR=""
          if [ -d "$PRIVATE_DIR/dsh-data" ]; then
            SOURCE_DIR="$PRIVATE_DIR/dsh-data"
          elif [ -d "$PRIVATE_DIR/.dsh" ]; then
            SOURCE_DIR="$PRIVATE_DIR/.dsh"
          elif [ -d "$PRIVATE_DIR/dsh" ]; then
            SOURCE_DIR="$PRIVATE_DIR/dsh"
          fi

          if [ -n "$SOURCE_DIR" ]; then
            echo "Restoring DSH data from: $SOURCE_DIR"
            rsync -a "$SOURCE_DIR/" "$HOME/.dsh/"
            echo "DSH data restored."
          else
            if [ "$ALLOW_EMPTY_BOOTSTRAP" != "true" ]; then
              echo "ERROR: No DSH data directory found."
              exit 1
            fi
            echo "No existing DSH data found. Creating a new DSH data directory."
            mkdir -p "$PRIVATE_DIR/dsh-data"
          fi

          DOCUMENTS_DIR=""
          if command -v xdg-user-dir >/dev/null 2>&1; then
            DOCUMENTS_DIR="$(xdg-user-dir DOCUMENTS 2>/dev/null || true)"
          fi
          if [ -z "$DOCUMENTS_DIR" ]; then
            DOCUMENTS_DIR="$HOME/Documents"
          fi
          DEFAULT_DSH_WORKSPACE="$DOCUMENTS_DIR/deepseek-harness/default-workspace"
          DEFAULT_WORKSPACE_BACKUP="$PRIVATE_DIR/workspaces/__dsh_default_workspace"

          if [ -d "$DEFAULT_WORKSPACE_BACKUP" ]; then
            echo "Restoring DSH default workspace to: $DEFAULT_DSH_WORKSPACE"
            mkdir -p "$DEFAULT_DSH_WORKSPACE"
            rsync -a "$DEFAULT_WORKSPACE_BACKUP/" "$DEFAULT_DSH_WORKSPACE/"
          fi

          if [ -d "$PRIVATE_DIR/workspaces" ]; then
            echo "Restoring custom workspaces..."
            find "$PRIVATE_DIR/workspaces" \
              -mindepth 1 -maxdepth 1 -type d \
              ! -name "__dsh_default_workspace" -print0 |
            while IFS= read -r -d '' DIR; do
              NAME="$(basename "$DIR")"
              echo "Restoring workspace: $NAME"
              mkdir -p "/home/runner/$NAME"
              rsync -a "$DIR/" "/home/runner/$NAME/"
            done
          else
            echo "No previous workspaces found."
          fi

          chmod 700 "$HOME/.dsh"
          if [ -f "$HOME/.dsh/.credentials.yaml" ]; then
            chmod 600 "$HOME/.dsh/.credentials.yaml"
          fi
          echo "restored=true" >> "$GITHUB_OUTPUT"
          echo "Persistent data restoration completed."

      # --------------------------------------------------
      # 8. Configure Git for automatic backup
      # --------------------------------------------------
      - name: Configure backup Git
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C private-data config user.name "github-actions[bot]"
          git -C private-data config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Private data repository configured."

      # --------------------------------------------------
      # 9. Create backup script
      # --------------------------------------------------
      - name: Create backup script
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/dsh-backup.sh" <<'BACKUP_SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          PRIVATE_DIR="private-data"
          DSH_DIR="$HOME/.dsh"
          echo "======================================"
          echo "Starting persistent data backup..."
          echo "======================================"
          mkdir -p "$PRIVATE_DIR/dsh-data" "$PRIVATE_DIR/workspaces"

          # Back up DSH home data.
          if [ -d "$DSH_DIR" ]; then
            rsync -a --delete "$DSH_DIR/" "$PRIVATE_DIR/dsh-data/"
          fi

          DOCUMENTS_DIR=""
          if command -v xdg-user-dir >/dev/null 2>&1; then
            DOCUMENTS_DIR="$(xdg-user-dir DOCUMENTS 2>/dev/null || true)"
          fi
          if [ -z "$DOCUMENTS_DIR" ]; then
            DOCUMENTS_DIR="$HOME/Documents"
          fi
          DEFAULT_DSH_WORKSPACE="$DOCUMENTS_DIR/deepseek-harness/default-workspace"
          DEFAULT_WORKSPACE_BACKUP="$PRIVATE_DIR/workspaces/__dsh_default_workspace"

          if [ -d "$DEFAULT_DSH_WORKSPACE" ]; then
            mkdir -p "$DEFAULT_WORKSPACE_BACKUP"
            echo "Backing up DSH default workspace..."
            rsync -a --delete "$DEFAULT_DSH_WORKSPACE/" "$DEFAULT_WORKSPACE_BACKUP/"
          fi

          # Back up only custom workspaces already represented in the private repository.
          for WORKSPACE_BACKUP in "$PRIVATE_DIR"/workspaces/*; do
            [ -d "$WORKSPACE_BACKUP" ] || continue
            NAME="$(basename "$WORKSPACE_BACKUP")"
            if [ "$NAME" = "__dsh_default_workspace" ]; then
              continue
            fi
            WORKSPACE_SOURCE="/home/runner/$NAME"
            if [ ! -d "$WORKSPACE_SOURCE" ]; then
              echo "Workspace not present on runner; skipping: $NAME"
              continue
            fi
            echo "Backing up workspace: $NAME"
            rsync -a --delete "$WORKSPACE_SOURCE/" "$WORKSPACE_BACKUP/"
          done

          # Only DSH home and managed workspaces are staged. S3 mounts are under /mnt
          # and intentionally excluded from the private Git repository backup.
          git -C "$PRIVATE_DIR" add -A -- dsh-data workspaces
          if git -C "$PRIVATE_DIR" diff --cached --quiet; then
            echo "No changes detected."
          else
            git -C "$PRIVATE_DIR" commit \
              -m "DSH backup $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            PUSH_SUCCESS=false
            for ATTEMPT in 1 2 3; do
              echo "Git push attempt: $ATTEMPT"
              if git -C "$PRIVATE_DIR" push origin HEAD; then
                PUSH_SUCCESS=true
                break
              fi
              echo "Push failed. Fetching remote changes..."
              git -C "$PRIVATE_DIR" fetch origin
              BRANCH="$(git -C "$PRIVATE_DIR" branch --show-current)"
              if ! git -C "$PRIVATE_DIR" rebase "origin/$BRANCH"; then
                git -C "$PRIVATE_DIR" rebase --abort || true
                echo "Rebase failed."
                break
              fi
            done
            if [ "$PUSH_SUCCESS" != "true" ]; then
              echo "ERROR: Could not push backup to private repository."
              exit 1
            fi
          fi
          echo "Backup completed."
          BACKUP_SCRIPT
          chmod +x "$RUNNER_TEMP/dsh-backup.sh"

      # --------------------------------------------------
      # 10. Mount Supabase S3 bucket as a local filesystem path
      # --------------------------------------------------
      - name: Mount Supabase S3 bucket
        shell: bash
        env:
          SUPABASE_S3_ENDPOINT: ${{ vars.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_REGION: ${{ vars.SUPABASE_S3_REGION }}
          SUPABASE_S3_BUCKET: ${{ vars.SUPABASE_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          for REQUIRED_VAR in SUPABASE_S3_ENDPOINT SUPABASE_S3_REGION SUPABASE_S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!REQUIRED_VAR:-}" ]; then
              echo "ERROR: Required Supabase S3 setting is missing: $REQUIRED_VAR"
              exit 1
            fi
          done

          MOUNT_DIR="$SUPABASE_S3_MOUNT"
          CONFIG_FILE="$RUNNER_TEMP/rclone-supabase.conf"
          CACHE_DIR="$RUNNER_TEMP/rclone-cache-supabase"
          sudo mkdir -p "$MOUNT_DIR"
          sudo chown "$(id -u):$(id -g)" "$MOUNT_DIR"
          mkdir -p "$CACHE_DIR"
          chmod 700 "$MOUNT_DIR" "$CACHE_DIR"

          rclone --config "$CONFIG_FILE" config create supabase s3 \
            provider Other env_auth true \
            endpoint "$SUPABASE_S3_ENDPOINT" region "$SUPABASE_S3_REGION"
          chmod 600 "$CONFIG_FILE"

          rclone --config "$CONFIG_FILE" mount \
            "supabase:${SUPABASE_S3_BUCKET}" "$MOUNT_DIR" \
            --daemon --vfs-cache-mode writes \
            --cache-dir "$CACHE_DIR" --dir-cache-time 30s \
            --log-file "$RUNNER_TEMP/rclone-supabase.log" --log-level INFO

          for _ in $(seq 1 30); do
            if mountpoint -q "$MOUNT_DIR"; then
              echo "Supabase S3 mounted at $MOUNT_DIR"
              break
            fi
            sleep 1
          done
          if ! mountpoint -q "$MOUNT_DIR"; then
            echo "ERROR: Supabase S3 mount did not become ready."
            cat "$RUNNER_TEMP/rclone-supabase.log" || true
            exit 1
          fi

      # --------------------------------------------------
      # 11. Mount Cloudflare R2 bucket as a separate local filesystem path
      # --------------------------------------------------
      - name: Mount Cloudflare R2 bucket
        shell: bash
        env:
          CLOUDFLARE_R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          for REQUIRED_VAR in CLOUDFLARE_R2_ENDPOINT CLOUDFLARE_R2_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!REQUIRED_VAR:-}" ]; then
              echo "ERROR: Required Cloudflare R2 setting is missing: $REQUIRED_VAR"
              exit 1
            fi
          done

          MOUNT_DIR="$CLOUDFLARE_R2_MOUNT"
          CONFIG_FILE="$RUNNER_TEMP/rclone-cloudflare-r2.conf"
          CACHE_DIR="$RUNNER_TEMP/rclone-cache-cloudflare-r2"
          sudo mkdir -p "$MOUNT_DIR"
          sudo chown "$(id -u):$(id -g)" "$MOUNT_DIR"
          mkdir -p "$CACHE_DIR"
          chmod 700 "$MOUNT_DIR" "$CACHE_DIR"

          # R2 uses the Cloudflare S3 provider and region auto.
          rclone --config "$CONFIG_FILE" config create cloudflare-r2 s3 \
            provider Cloudflare env_auth true \
            endpoint "$CLOUDFLARE_R2_ENDPOINT" region auto
          chmod 600 "$CONFIG_FILE"

          rclone --config "$CONFIG_FILE" mount \
            "cloudflare-r2:${CLOUDFLARE_R2_BUCKET}" "$MOUNT_DIR" \
            --daemon --vfs-cache-mode writes \
            --cache-dir "$CACHE_DIR" --dir-cache-time 30s \
            --log-file "$RUNNER_TEMP/rclone-cloudflare-r2.log" --log-level INFO

          for _ in $(seq 1 30); do
            if mountpoint -q "$MOUNT_DIR"; then
              echo "Cloudflare R2 mounted at $MOUNT_DIR"
              break
            fi
            sleep 1
          done
          if ! mountpoint -q "$MOUNT_DIR"; then
            echo "ERROR: Cloudflare R2 mount did not become ready."
            cat "$RUNNER_TEMP/rclone-cloudflare-r2.log" || true
            exit 1
          fi

      # --------------------------------------------------
      # 12. Start Cloudflare Named Tunnel
      # --------------------------------------------------
      - name: Start Cloudflare Tunnel
        shell: bash
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_TUNNEL_TOKEN is empty."
            exit 1
          fi
          echo "Starting Cloudflare Tunnel..."
          nohup cloudflared tunnel \
            --no-autoupdate run \
            --token "$CLOUDFLARE_TUNNEL_TOKEN" \
            > cloudflared.log 2>&1 < /dev/null &
          echo $! > cloudflared.pid
          sleep 5
          if ! kill -0 "$(cat cloudflared.pid)" 2>/dev/null; then
            echo "ERROR: Cloudflare Tunnel failed to start."
            tail -50 cloudflared.log
            exit 1
          fi
          echo "Cloudflare Tunnel process started."

      # --------------------------------------------------
      # 13. Start DSH Web
      # --------------------------------------------------
      - name: Start DSH Web
        id: start-dsh
        shell: bash
        env:
          CUSTOM_DOMAIN: ${{ env.CUSTOM_DOMAIN }}
          DSH_WEB_AUTH_PASSWORD: ${{ secrets.DSH_WEB_AUTH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          PUBLIC_HOST="${CUSTOM_DOMAIN#https://}"
          PUBLIC_HOST="${PUBLIC_HOST#http://}"
          PUBLIC_HOST="${PUBLIC_HOST%/}"

          echo "Starting DSH Web..."
          echo "Supabase S3 path: $SUPABASE_S3_MOUNT"
          echo "Cloudflare R2 path: $CLOUDFLARE_R2_MOUNT"
          setsid dsh web \
            --public-url "$CUSTOM_DOMAIN" \
            --trusted-host "$PUBLIC_HOST" \
            --no-open \
            > dsh-web.log 2>&1 < /dev/null &
          echo $! > dsh-web.pid

          echo "Waiting for DSH Web..."
          READY=false
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
              --max-time 3 http://127.0.0.1:3080 2>/dev/null || true)
            case "$HTTP_CODE" in
              2??|3??|401)
                READY=true
                echo "DSH Web responded with HTTP $HTTP_CODE."
                break
                ;;
            esac
            sleep 1
          done
          if [ "$READY" != "true" ]; then
            echo "ERROR: DSH Web failed to start."
            echo "----- DSH Web logs -----"
            tail -80 dsh-web.log || true
            exit 1
          fi
          echo "DSH Web is ready."

          RAW_TOKEN_URL=$(grep -oE 'https?://[^[:space:]]*token=[a-zA-Z0-9_-]+' \
            dsh-web.log | head -1 || true)
          if [ -n "$RAW_TOKEN_URL" ]; then
            TOKEN_STR=$(echo "$RAW_TOKEN_URL" | sed -E 's/.*token=([a-zA-Z0-9_-]+).*/\1/')
            TOKEN_URL="https://${PUBLIC_HOST}/?token=${TOKEN_STR}"
            echo "::add-mask::$TOKEN_STR"
            echo "::add-mask::$TOKEN_URL"
            echo "TOKEN_URL=$TOKEN_URL" >> "$GITHUB_ENV"
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "DSH access token extracted."
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: Token not found."
          fi

      # --------------------------------------------------
      # 14. Push access URL to WeChat
      # --------------------------------------------------
      - name: Push DSH URL to WeChat
        if: steps.start-dsh.outputs.has_token == 'true'
        shell: bash
        env:
          TOKEN_URL: ${{ env.TOKEN_URL }}
          WX_TOKEN: ${{ secrets.WX_TOKEN }}
          PUSH_API_URL: ${{ secrets.PUSH_API_URL }}
        run: |
          set -Eeuo pipefail
          if [ -z "$WX_TOKEN" ] || [ -z "$PUSH_API_URL" ]; then
            echo "ERROR: WX_TOKEN or PUSH_API_URL is empty."
            exit 1
          fi
          TIMESTAMP="$(date +%s)"
          NONCE="$(openssl rand -hex 8)"
          SIGNATURE=$(printf '%s\n' "$WX_TOKEN" "$TIMESTAMP" "$NONCE" |
            LC_ALL=C sort | tr -d '\n' | sha1sum | awk '{print $1}')
          echo "Preparing WeChat notification..."
          XML_BODY="<?xml version=\"1.0\" encoding=\"UTF-8\"?>
          <xml>
            <ToUserName><![CDATA[gh_test]]></ToUserName>
            <FromUserName><![CDATA[oUPTI2yAIBpKK_YkxHttqSc7TYiw]]></FromUserName>
            <CreateTime>${TIMESTAMP}</CreateTime>
            <MsgType><![CDATA[text]]></MsgType>
            <Content><![CDATA[202 ${TOKEN_URL}]]></Content>
          </xml>"
          RESPONSE=$(curl -fsS --max-time 20 -X POST \
            "${PUSH_API_URL}?signature=${SIGNATURE}&timestamp=${TIMESTAMP}&nonce=${NONCE}" \
            -H "Content-Type: application/xml; charset=utf-8" \
            --data-binary "$XML_BODY")
          echo "WeChat API response:"
          echo "$RESPONSE"
          echo "WeChat notification request completed."

      # --------------------------------------------------
      # 15. Keep alive and periodic backup
      # --------------------------------------------------
      - name: Keep alive and periodic backup
        shell: bash
        timeout-minutes: 310
        env:
          BACKUP_INTERVAL: ${{ env.BACKUP_INTERVAL }}
        run: |
          set -Eeuo pipefail
          echo "======================================"
          echo "DSH Web is running."
          echo "Periodic backup interval: ${BACKUP_INTERVAL}s"
          echo "Maximum runtime: 300 minutes"
          echo "======================================"
          BACKUP_SCRIPT="$RUNNER_TEMP/dsh-backup.sh"
          "$BACKUP_SCRIPT"
          START_TIME=$SECONDS
          LAST_BACKUP=$SECONDS
          MAX_RUNTIME=$((300 * 60))
          while (( SECONDS - START_TIME < MAX_RUNTIME )); do
            if ! kill -0 "$(cat dsh-web.pid)" 2>/dev/null; then
              echo "ERROR: DSH Web process has stopped."
              tail -80 dsh-web.log || true
              exit 1
            fi
            if ! kill -0 "$(cat cloudflared.pid)" 2>/dev/null; then
              echo "ERROR: Cloudflare Tunnel process has stopped."
              tail -80 cloudflared.log || true
              exit 1
            fi
            if (( SECONDS - LAST_BACKUP >= BACKUP_INTERVAL )); then
              echo "Periodic backup triggered."
              "$BACKUP_SCRIPT"
              LAST_BACKUP=$SECONDS
            fi
            sleep 30
          done
          echo "Maximum runtime reached."

      # --------------------------------------------------
      # 16. Final backup
      # --------------------------------------------------
      - name: Final persistent data backup
        if: always() && steps.restore.outputs.restored == 'true'
        shell: bash
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          echo "Starting final backup..."
          if [ -x "$RUNNER_TEMP/dsh-backup.sh" ]; then
            "$RUNNER_TEMP/dsh-backup.sh"
          else
            echo "WARNING: Backup script not found."
          fi

      # --------------------------------------------------
      # 17. Unmount S3 buckets and remove temporary configs
      # --------------------------------------------------
      - name: Unmount S3 buckets
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          for MOUNT_DIR in "$SUPABASE_S3_MOUNT" "$CLOUDFLARE_R2_MOUNT"; do
            if mountpoint -q "$MOUNT_DIR"; then
              fusermount3 -u "$MOUNT_DIR" || fusermount -u "$MOUNT_DIR" || true
            fi
          done
          rm -f "$RUNNER_TEMP/rclone-supabase.conf" \
            "$RUNNER_TEMP/rclone-cloudflare-r2.conf"

      # --------------------------------------------------
      # 18. Show status
      # --------------------------------------------------
      - name: Show DSH status
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "DSH Web workflow finished."
          echo "======================================"
          echo "DSH Web log:"
          if [ -f dsh-web.log ]; then
            tail -30 dsh-web.log
          fi
          echo "Cloudflare Tunnel log:"
          if [ -f cloudflared.log ]; then
            tail -20 cloudflared.log
          fi
          echo "======================================"
